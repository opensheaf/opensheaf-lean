name: lean
# Check that the Lean files are those of the chapters, then check the proofs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-literate.txt
      - run: literate tangle --check
      - run: literate tangle --check literate-sheaf/*.md
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
